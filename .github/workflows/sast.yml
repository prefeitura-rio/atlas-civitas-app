name: SAST

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
  # Reanalisa a main toda segunda-feira (09:00 UTC): advisories e regras novas
  # aparecem sem push, e o deploy de produção não olha para este resultado.
  schedule:
    - cron: "0 9 * * 1"

concurrency:
  # O run agendado tem grupo próprio: não cancela nem é cancelado pelo run de um push na main.
  group: sast-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'schedule' && '-agendado' || '' }}
  cancel-in-progress: true

permissions: {}

jobs:
  sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Run SAST (local action)
        uses: prefeitura-rio/actions/sast@master
        with:
          sonar_url: ${{ vars.SONARQUBE_URL }}
          sonar_token: ${{ secrets.SONARQUBE_TOKEN }}
          dd_url: ${{ vars.DEFECTDOJO_URL }}
          dd_token: ${{ secrets.DEFECTDOJO_TOKEN }}
          ts_tags: tag:prefect-cicd
          ts_oauth_client_id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts_oauth_secret: ${{ secrets.TS_OAUTH_SECRET }}
