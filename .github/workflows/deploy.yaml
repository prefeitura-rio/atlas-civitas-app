name: Deploy Frontend to Production

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - src/**
      - public/**
      - index.html
      - vite.config.ts
      - tsconfig*.json
      - tailwind.config.js
      - nginx.conf
      - Dockerfile
      - package.json
      - package-lock.json
      - k8s/**

jobs:
  build:
    name: Build Frontend for Production
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Build and push Frontend Docker image
        uses: ./.github/actions/docker-build
        with:
          working-directory: .
          image-tag: prod
          github-token: ${{ secrets.GITHUB_TOKEN }}
          build-args: |
            --build-arg VITE_API_URL=${{ vars.VITE_API_URL }}
            --build-arg VITE_MAPBOX_TOKEN=${{ secrets.VITE_MAPBOX_TOKEN }}