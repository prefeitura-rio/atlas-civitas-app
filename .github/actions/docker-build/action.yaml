name: Docker Build and Push
description: Build and push Docker image to GitHub Container Registry

inputs:
  working-directory:
    description: Working directory for the build
    required: true
  image-tag:
    description: Tag for the Docker image
    required: true
  build-args:
    description: Build arguments for Docker build
    required: false
    default: ""
  github-token:
    description: GitHub token for authentication
    required: true

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}

    - name: Build and push Docker image
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_BUILD_ARGS: ${{ inputs.build-args }}
        INPUT_IMAGE_TAG: ${{ inputs.image-tag }}
        IMAGE_REPOSITORY: ${{ github.repository }}
      run: |
        BUILD_ARGS=""

        if [ -n "$INPUT_BUILD_ARGS" ]; then
          BUILD_ARGS="$INPUT_BUILD_ARGS"
        fi

        # BUILD_ARGS fica sem aspas de propósito: cada "--build-arg NOME=valor" vira um argumento.
        docker build $BUILD_ARGS -t "ghcr.io/${IMAGE_REPOSITORY}:${INPUT_IMAGE_TAG}" .
        docker push "ghcr.io/${IMAGE_REPOSITORY}:${INPUT_IMAGE_TAG}"
